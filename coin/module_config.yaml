version: 2
accept_configuration:
  condition: property
  property: features
  not_contains_value: Disable

instructions:
  Build:
    - type: EnvironmentVariable
      variableName: VERIFY_SOURCE_SBOM
      variableValue: "ON"
    - type: AppendToEnvironmentVariable
      variableName: COMMON_NON_QTBASE_CMAKE_ARGS
      variableValue: " -DBUILD_ONLY_WEBENGINE_PLUGIN=ON"
    - type: AppendToEnvironmentVariable
      variableName: COMMON_NON_QTBASE_TARGET_CMAKE_ARGS
      variableValue: " -DBUILD_ONLY_WEBENGINE_PLUGIN=ON"
    - !include "{{qt/qtbase}}/coin_module_build_template_v2.yaml"

  Test:
    - !include "{{qt/qtwebview}}/run_native_plugin_tests.yaml"
    - !include "{{qt/qtwebview}}/run_webengine_plugin_tests.yaml"
    - !include "{{qt/qtbase}}/coin_module_test_docs.yaml"
